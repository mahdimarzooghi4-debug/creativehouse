name: Apply exact Figma hero

on:
  push:
    branches:
      - fix-hero-image-fidelity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-hero-image-fidelity

      - name: Download exact rendered hero and wire it as fallback
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://www.figma.com/api/mcp/asset/61231ad9-9bef-418b-8596-a4a33329ad49.png' \
            -o public/figma-home-hero.png
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          text = p.read_text(encoding='utf-8')
          old = 'src={heroMedia ? `/uploads/${heroMedia.storageKey}` : "/figma-home-hero.jpg"}'
          new = 'src={heroMedia ? `/uploads/${heroMedia.storageKey}` : "/figma-home-hero.png"}'
          if old not in text:
              raise SystemExit('Expected hero fallback source not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit exact hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/figma-home-hero.png app/page.tsx
          git commit -m 'Use exact high-quality Figma hero render'
          git push origin HEAD:fix-hero-image-fidelity
