name: Capture Figma hero asset

on:
  push:
    branches:
      - fix-hero-image-fidelity

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-hero-image-fidelity

      - name: Download original Figma hero source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://www.figma.com/api/mcp/asset/8ad4b739-16ec-447c-943f-92c366e07490' \
            -o public/figma-home-hero.jpg
          python - <<'PY'
          from pathlib import Path
          p = Path('public/figma-home-hero.jpg')
          data = p.read_bytes()
          if len(data) < 4 or not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Downloaded asset is not a JPEG')
          print(f'hero bytes: {len(data)}')
          PY
          rm -f public/figma-home-hero.png

      - name: Commit hero asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/figma-home-hero.jpg public/figma-home-hero.png
          git commit -m 'Replace low-quality hero with original Figma source'
          git push origin HEAD:fix-hero-image-fidelity
