name: Capture Figma hero asset

on:
  push:
    branches:
      - fix-hero-image-fidelity

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix-hero-image-fidelity

      - name: Download exact Figma hero image
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://www.figma.com/api/mcp/asset/61231ad9-9bef-418b-8596-a4a33329ad49.png' \
            -o public/figma-home-hero.png
          python - <<'PY'
          import struct
          p = 'public/figma-home-hero.png'
          with open(p, 'rb') as f:
              sig = f.read(24)
          if sig[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Downloaded asset is not a PNG')
          w, h = struct.unpack('>II', sig[16:24])
          print(f'hero dimensions: {w}x{h}')
          if (w, h) != (520, 293):
              raise SystemExit(f'Unexpected hero dimensions: {w}x{h}')
          PY

      - name: Commit hero asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/figma-home-hero.png
          git commit -m 'Replace low-quality hero with exact Figma export'
          git push origin HEAD:fix-hero-image-fidelity
