name: Apply hero rebuild

on:
  push:
    branches:
      - rebuild-hero-from-figma

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-hero-from-figma
      - name: Patch hero
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/qa-fixes.css
          git commit -m 'Rebuild hero from exact Figma visual export'
          git push origin HEAD:rebuild-hero-from-figma
